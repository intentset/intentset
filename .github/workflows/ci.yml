name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm comes from the packageManager field in package.json, so the version
      # is pinned in one place.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      # Intentset's own evidence: the tests again with the TAP reporter, imported as run records for each verification
      # whose selector a test title carries, then the model validated at L3, which reports link coverage and
      # current-pass coverage apart. Every record is a draft, so a missing run is reported, not failed.
      - run: pnpm run model:evidence --environment github-actions --uri-base "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - run: pnpm run intentset validate --level L3 --mode strict
      - run: pnpm run conformance
      # The same cases against micromark's development build, which asserts its
      # tokenizer contract where the production build does not. Vite, Vitest and
      # Next resolve that build by default, so a consumer's dev server runs it.
      # pnpm test ends with test:development for the unit tests.
      - run: pnpm run conformance:development
      - run: pnpm run smoke:packed
  # Intentset's own model, checked by the CLI this checkout builds: validate at L2 in strict mode, with no baseline (the
  # last one was retired on 2026-10-10, so any architecture violation is an error), and review against the base,
  # failing on a slice whose code changed while its records did not unless a commit says so with
  # `Intentset-Unchanged: <slice ID>`.
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # review compares with the base and reads the commits since it for Intentset-Unchanged trailers.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run model:validate
      - run: pnpm run model:review --base "origin/${{ github.base_ref || 'main' }}"
