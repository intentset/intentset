# Intentset registries (Core §4, §6, §7; VSA §3): the owners, audiences, release dimensions,
# evidence sources and shared resources the records of Intentset's own model may name. The owner is
# `maintainers` until there are teams. The packages are one open-source edition used by developers and their agents,
# and every record is a draft of the v0.1 specifications' implementation. The chat on intentset.org is the hosted
# edition, used by visitors and read back by maintainers.
owners:
  - maintainers
audiences:
  - engineering
  - product
releases:
  - v0.1-draft
roles:
  - developer
  - maintainer
  - visitor
editions:
  - hosted
  - open-source
flags: []
# Where each measure's evidence is to come from (Core §4).
#   chat-questions: the questions the chat on intentset.org keeps for 90 days, read by the questions report
#     (MEAS-QUESTIONS-ANSWERED).
#   review-reports: `intentset review --fail-on-drift` output in the CI of each repository that keeps a model.
#   conformance-claims: conformance runs of the published suite that other implementations report.
#   reviewer-survey: a short survey of the people who review changes in repositories that keep a model.
evidenceSources:
  - chat-questions
  - conformance-claims
  - review-reports
  - reviewer-survey
resources: []
